bs.forEach(b=>{if(b.textContent===ans)b.classList.add('ok');else if(b.textContent===sel)b.classList.add('bad')});
$('fb').innerHTML=`<div class="fb ${g?'ok':'bad'}"><b>${g?'Correct! 🪙 +'+n.pay:'Not this time.'}</b><br>${ex}</div>`;$('sub').textContent=k<4?'Next question':'Collect reward';if(!g)thief($('fb'),lost)}}
function fin(){const e=ok*n.pay+(ok===5?n.pay:0);save.coins+=e;save.best[i]=Math.max(save.best[i]||0,ok);save.story.attempts[i]++;const passed=ok>=4;if(passed){save.story.passed[i]=true;save.story.review[i]=false}else if(save.story.attempts[i]>=3+save.story.extra[i]){save.story.review[i]=true}
storySync();hud();beep(990,.3);
const status=passed?'🌟 Chapter unlocked!':save.story.review[i]?'🧑‍🏫 Teacher review needed':'🌱 Keep practising!';
const msg=passed?(i===3?'You have completed all four stories!':'The next chapter is now unlocked.'):(save.story.review[i]?'You have used all your attempts. Ask your teacher for a review.':'Read the story again and try once more.');
modal(`<h1>${passed?'🌟 Wonderful!':save.story.review[i]?'🧑‍🏫 Review needed':'🌱 Keep practising!'}</h1><p>${n.n} says: “${msg}”</p><div class="pills" style="margin:8px 0"><div class="pill">Correct ${ok}/5</div><div class="pill">🪙 +${e}${ok===5?' (perfect bonus!)':''}</div><div class="pill">Attempt ${save.story.attempts[i]}/${3+save.story.extra[i]}</div></div><p><b>${status}</b></p><button class="btn g" id="bk">${passed&&i===3?'See the ending':'Back to the village'}</button>`);
$('bk').onclick=()=>{closeM();G.run=true;if(passed&&i===3)storyEnding()}
}
